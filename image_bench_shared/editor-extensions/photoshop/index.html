<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            padding: 8px;
            color: var(--uxp-host-text-color);
            font-size: var(--uxp-host-font-size);
        }

        .row {
            display: flex;
            flex-direction: column;
            gap: 2px;
            margin-bottom: 6px;
        }

        .section {
            padding-top: 4px;
            border-top: 1px solid var(--uxp-host-border-color, #444);
        }

        sp-label {
            margin: 0;
        }

        .buttons {
            display: flex;
            flex-direction: row;
            gap: 4px;
        }

        .buttons sp-button {
            flex: 1 1 0;
            min-width: 0;
            margin: 0;
        }

        .url-row {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 6px;
        }

        .url-row sp-textfield {
            flex: 1 1 auto;
            width: auto;
            min-width: 0;
        }

        #recent-toggle {
            flex: 0 0 auto;
            margin-left: -4px;
        }

        #recent-urls {
            display: none;
            flex-direction: column;
            margin-top: 2px;
            border: 1px solid var(--uxp-host-border-color, #444);
            border-radius: 4px;
        }

        #recent-urls.open {
            display: flex;
        }

        .recent-item {
            display: flex;
            flex-direction: row;
            align-items: center;
            padding: 3px 6px;
        }

        .recent-item:hover {
            background-color: var(--uxp-host-widget-hover-background-color, rgba(128, 128, 128, 0.25));
        }

        .recent-url {
            flex: 1 1 auto;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .recent-remove {
            flex: 0 0 auto;
            padding: 0 4px;
            opacity: 0.6;
        }

        .recent-remove:hover {
            opacity: 1;
        }

        #connection-dot {
            flex: 0 0 auto;
            width: 8px;
            height: 8px;
            border-radius: 4px;
            background-color: #e5615b;
        }

        #connection-dot.connecting {
            background-color: #e8a33d;
        }

        #connection-dot.connected {
            background-color: #4ca35b;
        }

        #connection-dot.replaced {
            background-color: #8b949e;
        }

        #connection {
            flex: 0 0 auto;
        }

        .status-row {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 6px;
            min-height: 1.5em;
        }

        #busy-dot {
            flex: 0 0 auto;
            width: 8px;
            height: 8px;
            border-radius: 4px;
            background-color: #4b9cf5;
            display: none;
        }

        #busy-dot.active {
            display: block;
        }

        #busy-dot.dim {
            opacity: 0.25;
        }

        #status.error {
            color: #e5615b;
        }
    </style>
</head>
<body>
    <div class="row">
        <div class="url-row">
            <sp-textfield id="webui-url" placeholder="http://127.0.0.1:7860"
                          title="WebUI / ComfyUI URL (↓ shows the recent ones)"></sp-textfield>
            <sp-action-button id="recent-toggle" quiet title="Recent URLs">▾</sp-action-button>
            <div id="connection-dot"></div>
            <sp-action-button id="connection" title="Not connected: click or press Enter in the URL field to connect">Connect</sp-action-button>
        </div>
        <div id="recent-urls"></div>
    </div>
    <div class="row">
        <sp-label title="SD WebUI: the image goes to the img2img canvas while img2img › img2img is shown, else to img2img › Inpaint upload (or to the references if the Generate tab routes it there); the mask always goes to Inpaint upload. ComfyUI: the nodes marked ib:img and ib:mask"
            >To Image Bench: Input / Inpaint</sp-label>
        <div class="buttons">
            <sp-button id="send-image" variant="cta" title="Send the image to the img2img canvas (img2img › img2img shown) or to img2img › Inpaint upload">Image</sp-button>
            <sp-button id="send-mask" variant="primary" title="Send the selection as the mask of img2img › Inpaint upload">Mask</sp-button>
            <sp-button id="send-image-and-mask" variant="secondary" title="Send the image and the selection as its mask to img2img › Inpaint upload">Both</sp-button>
        </div>
    </div>
    <div class="row section">
        <sp-label title="ControlNet targets are supported by SD WebUI only">To Image Bench: ControlNet</sp-label>
        <div class="buttons">
            <sp-button id="send-cn-preprocess" variant="primary"
                       title="Send to preprocess: runs the preprocessor on the image and places the preview as a layer">Preproc.</sp-button>
            <sp-button id="send-cn-image" variant="secondary"
                       title="Use as control image: sets the preprocessor to None and clears the preview">Image</sp-button>
            <sp-button id="send-cn-mask" variant="secondary"
                       title="Send selection as mask: checks Use Mask, ControlNet applies inside the selection">Mask</sp-button>
        </div>
    </div>
    <div class="row section">
        <sp-label title="Compare works without a project; File and Final save into the folder of the project open in Image Bench"
            >To Image Bench: Keep</sp-label>
        <div class="buttons">
            <sp-button id="send-compare" variant="secondary"
                       title="Add the image to the Compare tab of Image Bench">Compare</sp-button>
            <sp-button id="save-file" variant="secondary"
                       title="Save the document as &lt;project name&gt;-NNN.psd into the current project folder">File</sp-button>
            <sp-button id="save-final" variant="secondary"
                       title="Save the document as final-NNN.psd, .png and .jpg into the current project folder; the PNG becomes the project's final image">Final</sp-button>
        </div>
    </div>
    <div class="row section">
        <sp-checkbox id="smart-objects"
                     title="Keep placed layers as smart objects (scalable without loss, but their pixels cannot be edited directly). Otherwise they are rasterized"
            >Images from Image Bench as smart objects</sp-checkbox>
    </div>
    <div class="status-row">
        <div id="busy-dot"></div>
        <sp-detail id="status"></sp-detail>
    </div>
    <script src="index.js"></script>
</body>
</html>
