<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            padding: 8px;
            color: var(--uxp-host-text-color);
            font-size: var(--uxp-host-font-size);
        }

        .row {
            display: flex;
            flex-direction: column;
            gap: 2px;
            margin-bottom: 6px;
        }

        .section {
            padding-top: 4px;
            border-top: 1px solid var(--uxp-host-border-color, #444);
        }

        sp-label {
            margin: 0;
        }

        .preview-box {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 120px;
            margin-top: 6px;
            background-color: #000;
            border: 1px solid var(--uxp-host-border-color, #444);
        }

        #preview {
            width: 100%;
        }

        #preview-empty {
            color: #888;
        }

        .hidden {
            display: none;
        }

        .slider-header {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
        }

        sp-slider {
            width: 100%;
        }

        .source-row {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 6px;
        }

        .source-row sp-radio-group {
            flex: 1 1 auto;
        }

        .buttons {
            display: flex;
            flex-direction: row;
            gap: 4px;
        }

        .buttons sp-button {
            flex: 1 1 auto;
            margin: 0;
            white-space: nowrap;
        }

        .status-row {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 6px;
            min-height: 1.5em;
        }

        #busy-dot {
            flex: 0 0 auto;
            width: 8px;
            height: 8px;
            border-radius: 4px;
            background-color: #4b9cf5;
            display: none;
        }

        #busy-dot.active {
            display: block;
        }

        #busy-dot.dim {
            opacity: 0.25;
        }

        #status.error {
            color: #e5615b;
        }
    </style>
</head>
<body>
    <div class="row">
        <div class="slider-header">
            <sp-label title="Hysteresis threshold: weaker edges connected to strong ones are kept down to the lower threshold">Threshold 1</sp-label>
            <sp-label id="threshold1-value"></sp-label>
        </div>
        <sp-slider id="threshold1" min="1" max="255" step="1" value="100"></sp-slider>
    </div>
    <div class="row">
        <div class="slider-header">
            <sp-label title="Hysteresis threshold: edges stronger than the higher threshold start the edge lines">Threshold 2</sp-label>
            <sp-label id="threshold2-value"></sp-label>
        </div>
        <sp-slider id="threshold2" min="1" max="255" step="1" value="200"></sp-slider>
    </div>
    <div class="row">
        <div class="slider-header">
            <sp-label title="Gaussian blur kernel size before the edge detection (1 = no blur)">Blur</sp-label>
            <sp-label id="blur-value"></sp-label>
        </div>
        <sp-slider id="blur" min="1" max="21" step="2" value="1"></sp-slider>
    </div>
    <div class="row section">
        <div class="source-row">
            <sp-radio-group id="source">
                <sp-radio value="merged" checked title="The visible image of all layers">Merged</sp-radio>
                <sp-radio value="layer" title="The pixels of the active layer only">Active layer</sp-radio>
            </sp-radio-group>
            <sp-action-button id="refresh" title="Read the image again (after editing it)">Refresh</sp-action-button>
        </div>
        <sp-checkbox id="fastPreview"
                     title="Compute the preview from the image downscaled to 640 px: faster for large images, but its edges are not exactly those applied"
            >Fast preview (approximate)</sp-checkbox>
        <sp-checkbox id="selectionOnly" title="Keep the edges inside the selection only">Selection only</sp-checkbox>
    </div>
    <div class="row section">
        <sp-label>Apply edges</sp-label>
        <div class="buttons">
            <sp-button id="apply-layer" variant="cta"
                       title="Put the edges into a layer of the document (the layer of the previous apply is reused)">As layer</sp-button>
            <sp-button id="apply-document" variant="secondary" title="Open the edges as a new document">As document</sp-button>
        </div>
    </div>
    <div class="status-row">
        <div id="busy-dot"></div>
        <sp-detail id="status"></sp-detail>
    </div>
    <div id="preview-box" class="preview-box">
        <img id="preview" class="hidden" alt="Canny edges preview">
        <sp-detail id="preview-empty">No preview</sp-detail>
    </div>
    <script src="index.js"></script>
</body>
</html>
